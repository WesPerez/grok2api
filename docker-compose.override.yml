services:
  grok2api:
    networks:
      grok2api_internal:
        ipv4_address: 172.30.0.2
  egress-quality-guard:
    network_mode: "service:grok2api"
    environment:
      GROK2API_BASE_URL: http://127.0.0.1:8000

networks:
  grok2api_internal:
    name: grok2api_internal
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.0.0/24
          gateway: 172.30.0.1
