# Include inside the HTTPS server that exposes Grok2API.
location = /grok2api {
    return 308 /grok2api/$is_args$args;
}

location ^~ /grok2api/ {
    rewrite ^/grok2api/(.*)$ /$1 break;
    proxy_pass http://127.0.0.1:18000;
    proxy_http_version 1.1;
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Prefix /grok2api;
    proxy_cookie_path /api/admin/v1/auth /grok2api/api/admin/v1/auth;
    client_max_body_size 32m;
}
